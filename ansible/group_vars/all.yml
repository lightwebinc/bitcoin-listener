---
# ============================================================
# shard-listener Ansible group_vars/all.yml
# Override any variable per-host in inventory/hosts.yml
# ============================================================

# ------------------------------------------------------------
# shard-listener source and build
# ------------------------------------------------------------
listener_repo: "https://github.com/lightwebinc/shard-listener.git"
listener_version: "main"
listener_install_dir: "/opt/shard-listener"
listener_bin_dir: "/usr/local/bin"
listener_user: "shard-listener"
listener_group: "shard-listener"

# Go toolchain version (used when building from source)
go_version: "1.25.10"
go_install_dir: "/usr/local/go"

# ------------------------------------------------------------
# Listener runtime configuration
# All flags have env-var equivalents set in the service unit
# ------------------------------------------------------------
listen_port: 9001               # UDP port for multicast receive (matches proxy egress_port)

# Beacon discovery (dynamic retry endpoint registry via ADVERT datagrams)
beacon_enabled: true            # Join beacon group and discover retry endpoints dynamically
beacon_port: 9300               # UDP port for ADVERT beacons (must match nack_port on retry endpoints)
beacon_scope: "site"            # Multicast scope for beacon group join: link | site | org | global

# Subtree group announcements (BRC-127 dynamic filtering)
subtree_groups: ""              # Comma-separated 32-char hex GroupIDs; empty = disabled
subtree_group_default_ttl: "900s"  # TTL for entries whose announcement carries TTL=0
announce_scope: "site"          # Multicast scope(s) for the control group join
sender_include: ""              # IPv6 CIDRs of trusted announcement senders; empty = all
sender_exclude: ""              # IPv6 CIDRs to reject before include check
shard_bits: 2
mc_scope: "site"                # link | site | org | global
mc_group_id: "0x000B"                # IANA group-id (default 0x000B = IANA Bitcoin)

# Filtering (empty strings = no filtering)
shard_include: ""               # Comma-separated shard indices, e.g. "0,1" (empty = join ALL groups)
subtree_include: ""             # Comma-separated hex subtree IDs to allow (V2 only)
subtree_exclude: ""             # Comma-separated hex subtree IDs to drop (V2 only)

# Egress (downstream unicast forward)
egress_addr: "127.0.0.1:9100"   # host:port of downstream consumer
egress_proto: "udp"             # udp | tcp
strip_header: false             # Send payload-only datagrams to egress

# NACK (NORM-inspired gap recovery)
retry_endpoints: ""             # Comma-separated host:port retry nodes
nack_jitter_max: "200ms"
nack_backoff_max: "5s"
nack_max_retries: 8             # Budget for 3 beacon + 3 static-seed entries with headroom
nack_gap_ttl: "10m"

# Runtime / observability
num_workers: 0                  # 0 = runtime.NumCPU()
metrics_addr: ":9200"           # Listener metrics (not :9100 — avoids collision with proxy)
otlp_endpoint: ""               # OTLP gRPC push; empty disables
otlp_interval: "30s"            # OTLP metric export cadence
# Unified logging — see bsv-multicast/docs/UnifiedLogging/unified-logging-plan.md
log_format: "json"              # text | json (json for fleet aggregation)
log_level: "info"               # debug|info|warn|error; runtime-togglable via POST /loglevel + SIGHUP
trace_sampling: 0               # 0..1 trace head sampling (0 = off; exports via otlp_endpoint)
drain_timeout: "0s"             # Pre-shutdown drain; set ≥ LB check interval in prod
instance_id: ""                 # OTel service.instance.id; empty = hostname
listener_debug: false
verify_payload_hash: false      # Verify SHA256d(payload)==TxID on V2 frames; drop on mismatch

# Multicast egress (domain bridging) — disabled by default
mc_egress_enabled: false
mc_egress_iface: ""
mc_egress_port: 0
mc_egress_scope: ""
mc_egress_group_id: ""
mc_egress_hoplimit: 1

# Block header egress (BRC-135): re-emit 80-byte header from BRC-131 BlockAnnounce
# as a 172-byte BRC-135 frame on a dedicated SPV egress path. Disabled by default.
header_egress_enabled: false
header_egress_addr: "127.0.0.1:9101"
header_egress_proto: "udp"
header_mc_egress_enabled: false
header_mc_egress_iface: ""
header_mc_egress_port: 0
header_mc_egress_scope: ""
header_mc_egress_group_id: ""
header_mc_egress_hoplimit: 1

# Per-deployment egress TxID dedup.
# HA siblings share deployment_id; distinct deployment_ids race independently.
# Empty deployment_id/node_id → derived from hostname at runtime.
deployment_id: ""
node_id: ""
# Tier-2 backend is modular (shard-common/cache): redis|aerospike|memory|none.
# Empty backend infers redis when the matching redis_addr is set, else none.
# See bsv-multicast/docs/ModularCacheBackend/modular-cache-backend.md
egress_dedup_backend: ""          # redis|aerospike|memory|none
egress_dedup_redis_addr: ""       # Redis/Valkey/Dragonfly addr; empty = local-only
egress_dedup_aerospike_hosts: ""  # comma-separated host:port (required when backend=aerospike)
egress_dedup_aerospike_namespace: "cache"
egress_dedup_aerospike_set: "bsl-egr"
egress_dedup_prefix: "bsl:egr:"  # key prefix (per-deployment namespace)
egress_dedup_ttl_redis: "60s"     # tier-2 entry TTL
egress_dedup_local_cap: 1048576   # tier-1 LRU capacity; 0 = disable egress dedup

# Courtesy ingress mark: SETNX into the proxy's ingress namespace so the proxy
# knows a TxID is already on the network. Leave the backend none (and
# ingress_set_redis_addr empty) to disable. prefix MUST match proxy's
# txid_dedup_prefix. The two stores are addressed independently.
ingress_set_backend: ""           # redis|aerospike|memory|none
ingress_set_redis_addr: ""        # Redis addr (same instance as proxy's dedup Redis)
ingress_set_aerospike_hosts: ""   # comma-separated host:port
ingress_set_aerospike_namespace: "cache"
ingress_set_aerospike_set: "bsp-tx"
ingress_set_prefix: "bsp:tx:"    # Must match proxy's txid_dedup_prefix
ingress_set_ttl: "10m"
ingress_set_local_cap: 1048576

# ------------------------------------------------------------
# Firewall perimeter (multicast-fabric isolation)
# Default ON; set false for labs where broader connectivity is desired.
# ------------------------------------------------------------
enable_firewall: true
mgmt_cidrs_v4: []               # SSH / metrics scrape allow-list (IPv4). MUST be set per deployment.
mgmt_cidrs_v6: []               # SSH / metrics scrape allow-list (IPv6).

# ------------------------------------------------------------
# Networking (ingress / multicast-receive side)
# ------------------------------------------------------------
ingress_mode: "ethernet"        # ethernet | gre
ingress_iface: "eth0"           # NIC for multicast group joins. MUST be set per-host
                                # (group_vars/all precedence defeats inventory-group vars).

# Multicast route prefix for the ingress interface.
# Empty = auto-derive from mc_scope (link=ff02::/16, site=ff05::/16, etc.)
mc_route_prefix: ""

# GRE tunnel (only used when ingress_mode == gre).
#
# The fabric itself is IPv6-only: the tunnel's *inner* payload is always IPv6
# multicast. The tunnel's *outer* transport may be IPv6 (ip6gre on Linux, gif
# on FreeBSD) or IPv4 (gre on Linux, gif on FreeBSD) — e.g. when the fabric
# ingress is reached over the public IPv4 internet.
#
# When ingress_mode=gre, set ingress_iface to gre_iface on each host so the
# listener joins groups on the tunnel interface.
gre_outer_proto: "ipv6"         # ipv6 | ipv4 — outer transport for the GRE tunnel
gre_iface: "gre6-bsl"           # Tunnel interface name
gre_inner_ipv6: ""              # IPv6 address/prefix assigned to the tunnel iface

# Outer endpoints: set the pair matching gre_outer_proto.
gre_local_ip6: ""               # Local outer endpoint (ipv6 outer)
gre_remote_ip6: ""              # Remote outer endpoint (ipv6 outer)
gre_local_ip4: ""               # Local outer endpoint (ipv4 outer)
gre_remote_ip4: ""              # Remote outer endpoint (ipv4 outer)

# ------------------------------------------------------------
# BGP (optional)
# Sole purpose on listener: advertise this listener's own unicast prefix into
# the fabric so MLD/PIM can build multicast distribution trees toward it.
# NACK is send-only, so no reverse-path advertisement is required.
# ------------------------------------------------------------
enable_bgp: false
bgp_daemon: "bird2"             # bird2 | frr

bgp_prefix: []                  # IPv4 prefixes announced by this node
bgp_vip: ""                     # IPv4 loopback VIP (this listener's identity)
bgp_prefix6: []                 # IPv6 prefixes announced by this node
bgp_vip6: ""                    # IPv6 loopback VIP (this listener's identity)

bgp_local_as: 65002             # Listener default AS (ingress uses 65001)
bgp_peer_as: 65000
bgp_peer_ip: ""
bgp_peer_ip6: ""
bgp_router_id: "{{ ansible_default_ipv4.address }}"
bgp_hold_time: 90
bgp_keepalive: 30
bgp_password: ""

# iBGP peers (used by bgp-ibgp role, playbook: bgp-ibgp.yml)
# Each entry: { peer_ip: "", peer_ip6: "", description: "" }
bgp_ibgp_peers: []
